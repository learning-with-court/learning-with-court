name: Validate Plugin

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Validate marketplace and plugin manifests
        run: node scripts/validate-plugin.mjs

      - name: Check the dev plugins are in sync with theirs
        run: node scripts/gen-dev-plugin.mjs --check

      - name: Validate all four plugins with Claude Code
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          export PATH="$HOME/.local/bin:$PATH"
          claude plugin validate plugins/lwc-workshops
          claude plugin validate plugins/lwc-workshops-dev
          claude plugin validate plugins/lwc-pages
          claude plugin validate plugins/lwc-pages-dev
